name: Validate Site

on:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://research.notelligent.app/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Validate content and output
        run: pnpm validate

      - name: Install browser test runtimes
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Verify reading, motion and keyboard flows
        run: |
          pnpm test:authoring
          pnpm test:spatial
          pnpm test:topics-evidence
          pnpm test:chapter-scroll
          pnpm test:spatial:accessibility
          pnpm test:spatial:quality
          pnpm verify:disclosures
