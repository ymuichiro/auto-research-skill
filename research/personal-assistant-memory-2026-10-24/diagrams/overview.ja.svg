<svg xmlns="http://www.w3.org/2000/svg" width="420" height="525" viewBox="0 0 420 525" role="img" aria-labelledby="coordination-ja-title coordination-ja-desc" font-family="var(--ard-font-ui)" fill="var(--ard-text-strong)">
<title id="coordination-ja-title">dotが会話を読み、質問と残った作業を整理する</title><desc id="coordination-ja-desc">人間が仕事を頼む。dotはタスクの会話を読んで残った作業を進めるよう指示し、人間に答えてほしい相談と作業の結果を返す。</desc>
<rect x="55" y="10" width="310" height="86" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="210" y="45" text-anchor="middle" font-size="26">人間</text><text x="210" y="76" text-anchor="middle" font-size="18">仕事を頼む、相談に答える</text><path d="M105 96V120" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="105,120 109,111 101,111" fill="var(--ard-signal)"/><text x="105" y="148" text-anchor="middle" font-size="18">依頼と回答</text><path d="M105 163V188" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="105,188 109,179 101,179" fill="var(--ard-signal)"/><path d="M315 188V163" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="315,163 311,172 319,172" fill="var(--ard-signal)"/><text x="315" y="148" text-anchor="middle" font-size="18">相談と報告</text><path d="M315 120V96" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="315,96 311,105 319,105" fill="var(--ard-signal)"/><rect x="55" y="190" width="310" height="114" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="210" y="227" text-anchor="middle" font-size="30">dot</text><text x="210" y="258" text-anchor="middle" font-size="18">タスクの会話を読む</text><text x="210" y="285" text-anchor="middle" font-size="18">質問と残った作業を整理</text><path d="M105 304V326" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="105,326 109,317 101,317" fill="var(--ard-signal)"/><text x="105" y="354" text-anchor="middle" font-size="18">続きを指示</text><path d="M105 369V394" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="105,394 109,385 101,385" fill="var(--ard-signal)"/><path d="M315 394V369" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="315,369 311,378 319,378" fill="var(--ard-signal)"/><text x="315" y="354" text-anchor="middle" font-size="18">進み具合と質問</text><path d="M315 326V304" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="315,304 311,313 319,313" fill="var(--ard-signal)"/><path d="M70 414V396H350V414" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><path d="M210 396V414" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><rect x="8" y="416" width="124" height="96" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="70" y="451" text-anchor="middle" font-size="22">Codex A</text><text x="70" y="480" text-anchor="middle" font-size="18">調査、実装</text><text x="70" y="500" text-anchor="middle" font-size="18">検証</text><rect x="148" y="416" width="124" height="96" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="210" y="451" text-anchor="middle" font-size="22">Codex B</text><text x="210" y="480" text-anchor="middle" font-size="18">調査、実装</text><text x="210" y="500" text-anchor="middle" font-size="18">検証</text><rect x="288" y="416" width="124" height="96" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="350" y="451" text-anchor="middle" font-size="22">Codex C</text><text x="350" y="480" text-anchor="middle" font-size="18">調査、実装</text><text x="350" y="500" text-anchor="middle" font-size="18">検証</text>
</svg>
