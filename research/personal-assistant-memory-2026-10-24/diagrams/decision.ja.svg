<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720" role="img" aria-labelledby="decision-ja-title decision-ja-desc" font-family="var(--ard-font-ui)" fill="var(--ard-text-strong)">
<title id="decision-ja-title">Aはテストを進め、Bは相談し、Cは止めておく</title><desc id="decision-ja-desc">前の依頼と今の進み具合を読む。Aのテストは既に頼んだので進める。Bのサービス追加は人間に聞く。Cは再開の指示があるまで止めておく。</desc>
<rect x="8" y="10" width="196" height="100" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><rect x="216" y="10" width="196" height="100" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="106" y="43" text-anchor="middle" font-size="20">前に話したこと</text><text x="106" y="73" text-anchor="middle" font-size="18">何を頼んだか</text><text x="106" y="96" text-anchor="middle" font-size="18">後から変えた指示</text><text x="314" y="43" text-anchor="middle" font-size="21">今の進み具合</text><text x="314" y="73" text-anchor="middle" font-size="18">何が終わったか</text><text x="314" y="96" text-anchor="middle" font-size="18">何が残っているか</text><path d="M106 110V130H210V153" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="210,153 214,144 206,144" fill="var(--ard-signal)"/><path d="M314 110V130H210" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><rect x="38" y="157" width="344" height="103" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="210" y="191" text-anchor="middle" font-size="21">依頼と変更を読み直す</text><text x="210" y="221" text-anchor="middle" font-size="18">何を任せ、何を止めたか</text><text x="210" y="247" text-anchor="middle" font-size="18">読めない会話は人間に確認</text><path d="M210 260V287" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="210,287 214,278 206,278" fill="var(--ard-signal)"/><rect x="38" y="290" width="344" height="74" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="210" y="320" text-anchor="middle" font-size="21">仕事ごとに返事を分ける</text><text x="210" y="348" text-anchor="middle" font-size="18">頼んだことか、新しい相談か</text><path d="M210 364V383H20V656" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><path d="M20 433H44" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="44,433 35,429 35,437" fill="var(--ard-signal)"/><rect x="47" y="395" width="357" height="88" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="225" y="429" text-anchor="middle" font-size="21">A：テストを進める</text><text x="225" y="460" text-anchor="middle" font-size="18">依頼に含まれ、まだ終わっていない</text><path d="M20 545H44" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="44,545 35,541 35,549" fill="var(--ard-signal)"/><rect x="47" y="507" width="357" height="88" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="225" y="541" text-anchor="middle" font-size="21">B：サービスの相談を人間へ</text><text x="225" y="572" text-anchor="middle" font-size="18">まだ使ってよいと答えていない</text><path d="M20 657H44" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="44,657 35,653 35,661" fill="var(--ard-signal)"/><rect x="47" y="619" width="357" height="88" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="225" y="653" text-anchor="middle" font-size="21">C：止めたままにする</text><text x="225" y="684" text-anchor="middle" font-size="18">再開してと言われるまで動かさない</text>
</svg>
