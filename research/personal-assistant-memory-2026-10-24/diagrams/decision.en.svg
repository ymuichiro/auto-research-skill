<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720" role="img" aria-labelledby="decision-en-title decision-en-desc" font-family="var(--ard-font-ui)" fill="var(--ard-text-strong)">
<title id="decision-en-title">Run A’s tests, ask about B, and keep C paused</title><desc id="decision-en-desc">Read earlier requests and current progress. Run A’s already requested tests, ask the user about B’s service, and keep C paused until the user requests resumption.</desc>
<rect x="8" y="10" width="196" height="100" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><rect x="216" y="10" width="196" height="100" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="106" y="43" text-anchor="middle" font-size="20">Earlier conversations</text><text x="106" y="73" text-anchor="middle" font-size="18">What was requested</text><text x="106" y="96" text-anchor="middle" font-size="18">Later changes</text><text x="314" y="43" text-anchor="middle" font-size="21">Current progress</text><text x="314" y="73" text-anchor="middle" font-size="18">What is finished</text><text x="314" y="96" text-anchor="middle" font-size="18">What remains</text><path d="M106 110V130H210V153" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="210,153 214,144 206,144" fill="var(--ard-signal)"/><path d="M314 110V130H210" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><rect x="38" y="157" width="344" height="103" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="210" y="191" text-anchor="middle" font-size="21">Check requests and changes</text><text x="210" y="221" text-anchor="middle" font-size="18">What was requested or paused</text><text x="210" y="247" text-anchor="middle" font-size="18">Ask about unreadable conversations</text><path d="M210 260V287" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="210,287 214,278 206,278" fill="var(--ard-signal)"/><rect x="38" y="290" width="344" height="74" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="210" y="320" text-anchor="middle" font-size="21">Choose a reply for each task</text><text x="210" y="348" text-anchor="middle" font-size="18">Already requested, or a new question?</text><path d="M210 364V383H20V656" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><path d="M20 433H44" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="44,433 35,429 35,437" fill="var(--ard-signal)"/><rect x="47" y="395" width="357" height="88" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="225" y="429" text-anchor="middle" font-size="20">A: Run the requested tests</text><text x="225" y="460" text-anchor="middle" font-size="18">Requested, still unfinished</text><path d="M20 545H44" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="44,545 35,541 35,549" fill="var(--ard-signal)"/><rect x="47" y="507" width="357" height="88" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="225" y="541" text-anchor="middle" font-size="20">B: Ask about the service</text><text x="225" y="572" text-anchor="middle" font-size="18">Not yet approved by the user</text><path d="M20 657H44" fill="none" stroke="var(--ard-signal)" stroke-width="2"/><polygon points="44,657 35,653 35,661" fill="var(--ard-signal)"/><rect x="47" y="619" width="357" height="88" rx="12" fill="var(--ard-surface)" stroke="var(--ard-border-strong)"/><text x="225" y="653" text-anchor="middle" font-size="20">C: Keep the work paused</text><text x="225" y="684" text-anchor="middle" font-size="18">Wait until the user says resume</text>
</svg>
